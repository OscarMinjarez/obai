name: Obai CI/CD

on:
  push:
    branches: [ master, developer ]
  pull_request:
    branches: [ master, developer ]

jobs:
  lint-and-format:
    name: Frontend & Shared Linting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Check Linting and Formatting
        # Este comando ahora incluye .vue y .tsx gracias al cambio en package.json
        run: npm run format:check

  test-backend:
    name: Backend Testing
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Run Backend Tests
        # Ejecuta Jest (que según package.json cubre apps/*-api y libs/)
        run: npm run test

  build-check:
    name: Build Verification
    runs-on: ubuntu-latest
    needs: [lint-and-format, test-backend]
    steps:
      - uses: actions/checkout@v4
      
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Build All
        run: npm run build
